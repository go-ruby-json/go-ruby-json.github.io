baseURL = "https://go-ruby-json.github.io/"
title = "go-ruby-json"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Parser"
  status = "ready"
  blurb = "`JSON.parse(s)` parses JSON text into the Ruby value graph (Hash/Array/String/Integer/Float/true/false/nil), with `symbolize_names` to key hashes by Symbol, exactly as MRI's parser does."
[[params.phases]]
  name = "Generator"
  status = "ready"
  blurb = "`JSON.generate(v)` emits compact JSON and `JSON.pretty_generate(v)` the indented form, matching reference Ruby's spacing and escaping byte-for-byte."
[[params.phases]]
  name = "Nesting & limits"
  status = "ready"
  blurb = "Depth tracking that raises `JSON::NestingError` past the configured limit, mirroring MRI's recursion guard on both parse and generate."
[[params.phases]]
  name = "Error taxonomy"
  status = "ready"
  blurb = "The `JSON::ParserError` / `JSON::NestingError` / `JSON::GeneratorError` hierarchy, raised on the same inputs and with the same messages as reference Ruby."
[[params.phases]]
  name = "Number & string fidelity"
  status = "ready"
  blurb = "Integers, floats, and escapes (including `\\uXXXX` surrogate pairs) parsed and emitted exactly as MRI, including the float formatting edge cases."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "A wide corpus round-tripped here and by the system `ruby`/`json`, compared byte-for-byte; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
